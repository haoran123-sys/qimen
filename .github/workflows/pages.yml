name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch site content
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --max-time 60 "https://aka.doubaocdn.com/s/YyWJduxR5R" -o index.html && break
            echo "retry $i"; sleep 10
          done
          echo "size: $(wc -c < index.html) bytes"
          MD5=$(md5sum index.html | cut -d' ' -f1)
          echo "md5: $MD5"
          echo "$MD5" | grep -q 983097c5560a9dc6081fb19ab76678c2

      - name: Commit page into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add qimen page" || echo "no change"
          git push || echo "push failed"

      - name: Try enabling Pages via API
        continue-on-error: true
        run: |
          code=$(curl -s -o resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "pages-create-status=$code"
          cat resp.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
